<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>星屿 · 个人站</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  #stage { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  .panel { position: fixed; background: rgba(10, 14, 24, 0.78); border: 1px solid rgba(120, 150, 210, 0.22);
    border-radius: 10px; color: #cfd8ea; backdrop-filter: blur(6px); font-size: 12px; }
  #topbar { top: 12px; left: 50%; transform: translateX(-50%); padding: 8px 16px; display: flex;
    gap: 14px; align-items: center; white-space: nowrap; }
  #topbar .v { color: #ffd98a; font-weight: 600; }
  #topbar input[type=range] { width: 130px; accent-color: #e8b45a; }
  #status { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); padding: 6px 16px;
    font-size: 12px; color: #ffd98a; background: rgba(10, 14, 24, 0.78); border-radius: 8px;
    border: 1px solid rgba(232, 180, 90, 0.35); display: none; }
  #dests { left: 12px; top: 12px; width: 208px; max-height: 72vh; display: flex; flex-direction: column; }
  #dests h3 { margin: 0; padding: 9px 12px; font-size: 12px; color: #ffd98a; cursor: pointer;
    letter-spacing: 0.1em; border-bottom: 1px solid rgba(120, 150, 210, 0.18); user-select: none;
    display: flex; justify-content: space-between; align-items: center; }
  #homeBtn { color: #ffd98a; font-size: 11px; letter-spacing: 0.05em; border: 1px solid rgba(232, 180, 90, 0.45);
    border-radius: 8px; padding: 2px 9px; cursor: pointer; transition: background 0.15s, transform 0.1s; }
  #homeBtn:hover { background: rgba(232, 180, 90, 0.22); }
  #homeBtn:active { transform: scale(0.94); }
  #dests ul { margin: 0; padding: 4px 6px 4px 0; overflow-y: auto; list-style: none; }
  /* slim custom scrollbars (PC) */
  #dests ul, #params #paramsBody {
    scrollbar-width: thin; scrollbar-color: rgba(120, 150, 210, 0.35) transparent; }
  #dests ul::-webkit-scrollbar, #params #paramsBody::-webkit-scrollbar { width: 6px; }
  #dests ul::-webkit-scrollbar-track, #params #paramsBody::-webkit-scrollbar-track { background: transparent; }
  #dests ul::-webkit-scrollbar-thumb, #params #paramsBody::-webkit-scrollbar-thumb {
    background: rgba(120, 150, 210, 0.3); border-radius: 3px; }
  #dests ul::-webkit-scrollbar-thumb:hover, #params #paramsBody::-webkit-scrollbar-thumb:hover {
    background: rgba(232, 180, 90, 0.55); }
  #dests li { padding: 5px 12px; cursor: pointer; display: flex; justify-content: space-between; }
  #dests li:hover { background: rgba(232, 180, 90, 0.12); color: #ffe6b0; }
  #dests li .d { color: #7f8ca6; font-size: 11px; }
  #dests li .ib { font-style: normal; color: #8fb0ff; margin-left: 7px; font-size: 11px; cursor: pointer;
    border: 1px solid rgba(143, 176, 255, 0.4); border-radius: 50%; width: 15px; height: 15px;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  #dests li .ib:hover { background: rgba(143, 176, 255, 0.25); color: #dce8ff; }
  #params { right: 12px; top: 12px; width: 196px; padding: 10px 14px; }
  #params h3 { margin: 0 0 8px; font-size: 12px; color: #ffd98a; cursor: pointer; letter-spacing: 0.1em; user-select: none; }
  #params label { display: flex; justify-content: space-between; align-items: center; margin: 7px 0; color: #aab6cc; }
  #params input[type=range] { width: 90px; accent-color: #e8b45a; }
  #confirm { top: 92px; left: 50%; transform: translateX(-50%); padding: 10px 18px; display: none; z-index: 70;
    align-items: center; gap: 14px; }
  #confirm button { background: #e8b45a; color: #20180a; border: none; padding: 5px 14px; border-radius: 6px;
    cursor: pointer; font-weight: 600; }
  #confirm button.cancel { background: rgba(120, 130, 150, 0.25); color: #cfd8ea; }
  #tooltip { position: fixed; pointer-events: none; padding: 6px 10px; background: rgba(10, 14, 24, 0.9);
    border: 1px solid rgba(232, 180, 90, 0.4); border-radius: 6px; color: #ffe6b0; font-size: 12px;
    display: none; z-index: 10; line-height: 1.5; }
  #toast { position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%); padding: 8px 20px;
    background: rgba(10, 14, 24, 0.85); border: 1px solid rgba(232, 180, 90, 0.45); border-radius: 20px;
    color: #ffe6b0; font-size: 13px; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  #hint { position: fixed; left: 18px; bottom: 14px; font-size: 11px; color: rgba(245, 200, 120, 0.4);
    letter-spacing: 0.1em; pointer-events: none; }
  #credit { position: fixed; right: 14px; bottom: 12px; font-size: 10px; color: rgba(140, 155, 185, 0.35);
    pointer-events: none; }
  /* ---- mobile portrait ---- */
  #backdrop { position: fixed; inset: 0; background: rgba(2, 4, 10, 0.52); display: none; z-index: 68; }
  #ver { position: fixed; right: 10px; bottom: calc(5px + env(safe-area-inset-bottom)); color: rgba(140, 160, 200, 0.45);
    font-size: 10px; z-index: 20; pointer-events: none; letter-spacing: 0.06em; }
  #panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(8, 12, 22, 0.95);
    border: 1px solid rgba(120, 160, 230, 0.35); border-radius: 14px; padding: 20px 24px;
    max-width: 660px; width: min(92vw, 660px); max-height: 80vh; display: none; flex-direction: column;
    color: #cfd8ea; font-size: 13.5px; line-height: 1.7; z-index: 60;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px); }
  #panel #pnClose { position: absolute; right: 10px; top: 8px; width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid rgba(120, 160, 230, 0.35); background: rgba(30, 42, 66, 0.8); color: #ffd98a;
    cursor: pointer; font-size: 14px; line-height: 1; }
  #panel #pnClose:hover { background: rgba(232, 180, 90, 0.25); }
  #panel #pnKicker { color: #8fa3c8; font-size: 11px; letter-spacing: 0.08em; margin: 0 36px 2px 0; }
  #panel h3 { margin: 0 36px 2px 0; color: #ffd98a; font-size: 20px; letter-spacing: 0.05em; }
  #panel #pnMeta { color: #8fa3c8; font-size: 11.5px; margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px dashed rgba(120, 150, 210, 0.25); }
  #panel #pnBody { overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; min-height: 60px;
    scrollbar-width: thin; scrollbar-color: rgba(120, 150, 210, 0.35) transparent; }
  #panel #pnBody::-webkit-scrollbar { width: 6px; }
  #panel #pnBody::-webkit-scrollbar-track { background: transparent; }
  #panel #pnBody::-webkit-scrollbar-thumb { background: rgba(120, 150, 210, 0.3); border-radius: 3px; }
  #panel #pnBody::-webkit-scrollbar-thumb:hover { background: rgba(232, 180, 90, 0.55); }
  #panel #pnBody h4 { margin: 14px 0 4px; color: #ffe6b0; font-size: 15px; }
  #panel #pnBody p { margin: 6px 0; color: #c4d0e6; }
  #panel #pnBody blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid rgba(232, 180, 90, 0.5);
    background: rgba(30, 42, 66, 0.35); color: #a8b8d8; font-size: 12.5px; border-radius: 0 8px 8px 0; }
  #panel #pnBody figure { margin: 10px 0; }
  #panel #pnBody img { max-width: 100%; border-radius: 10px; border: 1px solid rgba(120, 150, 210, 0.25);
    display: block; }
  #panel #pnBody figure { aspect-ratio: 4 / 3; overflow: hidden; background: rgba(30, 42, 66, 0.45); }
  #panel #pnBody figure img { width: 100%; height: 100%; object-fit: cover; }
  #panel #pnBody figure.loaded { aspect-ratio: auto; background: none; }
  #panel #pnBody figure.loaded img { height: auto; object-fit: fill; }
  #panel #pnBody .gal figure { aspect-ratio: 4 / 3; }
  #panel #pnBody .gal figure.loaded { aspect-ratio: 4 / 3; }
  #panel #pnBody figcaption { color: #8fa3c8; font-size: 11px; margin-top: 4px; text-align: center; }
  #panel #pnBody figure.err, #panel #pnBody .gal figure.err { aspect-ratio: auto; min-height: 0; padding: 8px 12px;
    background: rgba(90, 30, 30, 0.35); border: 1px dashed rgba(255, 120, 120, 0.45); border-radius: 10px;
    color: #ffb0b0; font-size: 12px; }
  #panel #pnBody .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  /* v0.5: clickable zoom affordance + focus ring on panel images */
  #panel #pnBody figure.zoom { cursor: zoom-in; }
  #panel #pnBody figure.zoom:hover img { filter: brightness(1.08); }
  #panel #pnBody figure.zoom:focus-visible { outline: 2px solid rgba(140, 190, 255, 0.75); outline-offset: 2px;
    border-radius: 10px; }
  #lightbox { position: fixed; inset: 0; background: rgba(2, 4, 10, 0.9); display: none; z-index: 80;
    align-items: center; justify-content: center; flex-direction: column; opacity: 0;
    transition: opacity 0.18s ease; }
  #lightbox.on { opacity: 1; }
  #lightbox img { max-width: 92vw; max-height: 80vh; object-fit: contain; border-radius: 8px;
    box-shadow: 0 10px 70px rgba(0, 0, 0, 0.7); }
  #lbCap { color: #b9c4da; font-size: 12.5px; line-height: 1.6; margin-top: 12px; padding: 0 24px;
    text-align: center; max-width: 78vw; }
  #lightbox button { position: fixed; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(140, 170, 230, 0.35);
    background: rgba(12, 18, 32, 0.75); color: #d8e2f4; font-size: 20px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
  #lightbox button:hover { background: rgba(30, 44, 74, 0.9); }
  #lbClose { top: calc(14px + env(safe-area-inset-top)); right: 16px; }
  #lbPrev { left: 10px; top: 50%; transform: translateY(-50%); }
  #lbNext { right: 10px; top: 50%; transform: translateY(-50%); }
  #panel #pnBody .vid { margin: 10px 0; }
  #panel #pnBody .vid iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px;
    background: #000; }
  #panel #pnBody .lnx { list-style: none; margin: 6px 0; padding: 0; }
  #panel #pnBody .lnx li { padding: 6px 0; border-bottom: 1px dashed rgba(120, 150, 210, 0.15); }
  #panel #pnBody .lnx a { color: #ffd98a; text-decoration: none; border-bottom: 1px dotted rgba(255, 217, 138, 0.5); }
  #panel #pnBody .lnx a:hover { color: #ffe6b0; }
  #panel #pnBody .lnx .dsc { display: block; color: #8fa3c8; font-size: 11.5px; margin-top: 1px; }
  #contentWarn { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 99;
    background: rgba(140, 30, 30, 0.92); color: #ffe0e0; border: 1px solid rgba(255, 120, 120, 0.5);
    border-radius: 10px; padding: 10px 16px; font-size: 12.5px; max-width: 86vw;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); }
  .mbtn { position: fixed; top: calc(10px + env(safe-area-inset-top)); width: 42px; height: 42px;
    border-radius: 12px; background: rgba(10, 14, 24, 0.82); border: 1px solid rgba(120, 150, 210, 0.25);
    color: #ffd98a; font-size: 17px; display: none; align-items: center; justify-content: center;
    cursor: pointer; z-index: 30; backdrop-filter: blur(6px); user-select: none; }
  #btnDests { left: calc(10px + env(safe-area-inset-left)); }
  #btnParams { right: calc(10px + env(safe-area-inset-right)); }
  @media (max-width: 720px) {
    .mbtn { display: flex; }
    #topbar { top: calc(60px + env(safe-area-inset-top)); max-width: calc(100vw - 24px); }
    #topbar input[type=range] { width: 32vw; }
    #status { top: calc(110px + env(safe-area-inset-top)); max-width: 92vw; }
    #confirm { top: calc(108px + env(safe-area-inset-top)); max-width: 92vw; flex-wrap: wrap;
      justify-content: center; }
    #dests, #params { top: 0; bottom: 0; max-height: none; width: min(78vw, 300px); z-index: 40;
      transition: transform 0.25s ease; }
    #dests { left: 0; transform: translateX(-105%); border-radius: 0 14px 14px 0;
      padding-top: env(safe-area-inset-top); }
    #params { right: 0; transform: translateX(105%); border-radius: 14px 0 0 14px;
      padding-top: env(safe-area-inset-top); display: flex; flex-direction: column; }
    #dests.open, #params.open { transform: translateX(0); }
    #dests ul { flex: 1; -webkit-overflow-scrolling: touch; }
    #params #paramsBody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #hint { left: 12px; right: 12px; bottom: calc(8px + env(safe-area-inset-bottom)); font-size: 10px;
      letter-spacing: 0.04em; }
    #credit { display: none; }
    #toast { bottom: calc(44px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="backdrop"></div>
<div id="ver">星屿 v0.1</div>
<div id="btnDests" class="mbtn">◈</div>
<div id="btnParams" class="mbtn">⚙</div>
<div id="topbar" class="panel">
  <span>速度档 <input type="range" id="warp" min="0" max="10" step="0.25" value="0"></span>
  <span id="speedRead">0 pc/s</span>
</div>
<div id="status"></div>
<div id="dests" class="panel">
  <h3 id="destsTitle"><span>◈ 站点板块 <span id="destsCount"></span></span><span id="homeBtn" title="一键返航首页（太阳）">☀ 回家</span></h3>
  <ul id="destList"></ul>
</div>
<div id="params" class="panel">
  <h3 id="paramsTitle">⚙ 参数</h3>
  <div id="paramsBody">
    <label>星等阈值 <input type="range" id="magLimit" min="3.5" max="6.5" step="0.1" value="6"></label>
    <label>银河尘埃 <input type="checkbox" id="dustOn" checked></label>
    <label>拖尾强度 <input type="range" id="trailGain" min="0" max="2" step="0.1" value="1"></label>
    <label>板块标签 <input type="checkbox" id="labelsOn" checked></label>
    <label>飞船显示 <input type="checkbox" id="rabbitOn" checked></label>
    <label>字符粒子 <input type="checkbox" id="glyphOn" checked></label>
    <label>引擎音效 <input type="checkbox" id="audioOn"></label>
  </div>
</div>
<div id="confirm" class="panel">
  <span id="confirmText"></span>
  <button id="goBtn">出发</button>
  <button id="cancelBtn" class="cancel">取消</button>
</div>
<div id="tooltip"></div>
<div id="toast"></div>
<div id="panel">
  <button id="pnClose" title="关闭">✕</button>
  <div id="pnKicker"></div>
  <h3 id="pnTitle"></h3>
  <div id="pnMeta"></div>
  <div id="pnBody"></div>
</div>
<!-- v0.5: lightbox — click any image in the panel to view it full-size (← → to browse, ESC to close) -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="查看大图">
  <button id="lbClose" type="button" aria-label="关闭大图">✕</button>
  <button id="lbPrev" type="button" aria-label="上一张">‹</button>
  <img id="lbImg" alt="">
  <button id="lbNext" type="button" aria-label="下一张">›</button>
  <div id="lbCap"></div>
</div>
<div id="hint">↑↓ 加速/倒退 · ←→ 转向 · Shift+↑↓ 俯仰 · 滚轮/双指调速 · 点星标前往板块 · 长按/右键星标直接阅读 · [ESC]关闭面板/中止航行</div>
<div id="credit">恒星数据：HYG Database v4.1 (CC BY-SA 4.0) · astronexus · 板块内容见 content.js</div>
<script src="content.js"></script>

      if (a <= 0.02) continue;
      var L2 = slLen[i] * maxR * (0.5 + gain);
      var ca = Math.cos(slAng[i]), sa = Math.sin(slAng[i]);
      ctx.strokeStyle = 'rgba(195,218,255,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(cx + ca * slR[i], cy + sa * slR[i]);
      ctx.lineTo(cx + ca * (slR[i] + L2), cy + sa * (slR[i] + L2));
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  function renderRabbit() {
    if (!shipDirty) return;
    rbuf.fill(0);   // fully transparent: keep the starfield visible behind particles
    for (var p3 = 0; p3 < RABBIT_COUNT; p3++) {
      var c = col32[p3], m = params.glyphOn ? GLYPHS[gi[p3]] : SOLID;
      var x0 = hx[p3] | 0, y0 = hy[p3] | 0;
      if (x0 <= -G || y0 <= -G || x0 >= IMG_W || y0 >= IMG_H) continue;
      for (var gy3 = 0; gy3 < G; gy3++) {
        var yy3 = y0 + gy3; if (yy3 < 0 || yy3 >= IMG_H) continue;
        var rowB = yy3 * IMG_W + x0, mB = gy3 * G;
        for (var gx3 = 0; gx3 < G; gx3++) {
          if (!m[mB + gx3]) continue;
          var xx3 = x0 + gx3; if (xx3 < 0 || xx3 >= IMG_W) continue;
          rbuf[rowB + gx3] = c;
        }
      }
    }
    octx.putImageData(imgData, 0, 0);
    shipDirty = false;
  }

  // ================= navigation update =================
  function updateNav(dt) {
    var want;
    // v0.4 unified throttle: ↑/↓ ramp thrust in any mode (Shift = pitch trim, manual flight only).
    // Key grammar now matches the chase cam: fore/aft keys push the ship fore/aft, ←/→ yaw.
    if (keysOn['ArrowUp'] || keysOn['ArrowDown']) {
      var dir = keysOn['ArrowUp'] ? 1 : -1;
      if (shiftOn && mode === 'idle') {
        pitch = Math.max(-1.45, Math.min(1.45, pitch + dir * 1.7 * dt));
        updateBasis();
      } else {
        var w4 = mode === 'travel' ? Math.max(0, manualWarp + dir * 3.4 * dt) : manualWarp + dir * 3.4 * dt;
        setManual(w4);
      }
    }
    if (mode === 'aiming' && targetIdx >= 0) {
      want = aimAt(targetIdx, false);
      var dYaw = want.yaw - yaw, dPitch = want.pitch - pitch;
      var step = Math.min(1, dt * 2.8);
      yaw += dYaw * step; pitch += dPitch * step;
      pitch = Math.max(-1.45, Math.min(1.45, pitch));
      updateBasis();
      if (Math.abs(dYaw) < 0.02 && Math.abs(dPitch) < 0.02) startTravel();
    }
    if (mode === 'travel' && targetIdx >= 0) {
      var dTx = gx[targetIdx] - camX, dTy = gy[targetIdx] - camY, dTz = gz[targetIdx] - camZ;
      var dist = Math.hypot(dTx, dTy, dTz);
      var stopR = stopRadius();
      if (dist <= stopR) { stopTravel('arrive'); return; }
      // v2.3: closed-loop guidance — fly along the TRUE unit vector to the target each frame.
      // The old code flew along the view basis, which carries aiming tolerance (~0.02 rad):
      // 0.02 rad over an 800 pc trip = ~16 pc lateral miss, so the ship could never enter
      // Sol's fixed 0.35 pc parking sphere and sailed past into empty space (black screen).
      var tx2 = dTx / dist, ty2 = dTy / dist, tz2 = dTz / dist;
      // keep eyes on target: gently steer the view toward it (visual only, motion is exact)
      var w2 = aimAt(targetIdx, false);
      var st2 = Math.min(1, dt * 2.2);
      yaw += (w2.yaw - yaw) * st2; pitch += (w2.pitch - pitch) * st2;
      pitch = Math.max(-1.45, Math.min(1.45, pitch));
      updateBasis();
      var userV = warpToSpeed(warpLevel);
      var cruise = userV > 0 ? userV : 0.9;
      var a = Math.max(4, cruise * 0.35);
      var brakeV = Math.sqrt(2 * a * Math.max(0, dist - stopR));
      var targetV = userV <= 0 ? 0 : Math.min(cruise, brakeV);   // warp=0 -> brake to full stop & hold
      var easeK = userV <= 0 ? 6 : 1.4;   // hard brake when paused
      vEase += (targetV - vEase) * Math.min(1, dt * easeK);
      vNow = Math.max(0, vEase);
      var step = vNow * dt;
      if (dist - step <= stopR) {   // would reach/pass the stop point this frame: land exactly
        var kk = step > 0 ? Math.max(0, (dist - stopR) / step) : 0;
        camX += tx2 * step * kk; camY += ty2 * step * kk; camZ += tz2 * step * kk;
        stopTravel('arrive'); return;
      }
      camX += tx2 * step; camY += ty2 * step; camZ += tz2 * step;
    } else {
      // v2.2 manual helm: arrow keys steer (idle mode only, auto-nav owns the helm otherwise)
      var st = 1.7 * dt;
      if (keysOn['ArrowLeft']) yaw -= st;
      if (keysOn['ArrowRight']) yaw += st;
      if (keysOn['ArrowLeft'] || keysOn['ArrowRight']) {
        pitch = Math.max(-1.45, Math.min(1.45, pitch));
        updateBasis();
      }
      // v2.2 manual / cruise movement: signed manualWarp (wheel & pinch), slider as forward fallback
      var mv = 0;
      if (manualWarp !== 0) mv = manualWarp < 0 ? -warpToSpeed(-manualWarp) : warpToSpeed(manualWarp);
      else if (warpLevel > 0) mv = warpToSpeed(warpLevel);
      if (mv !== 0) {
        vEase += (mv - vEase) * Math.min(1, dt * 1.6);
        vNow = vEase;
        camX += fx * vNow * dt; camY += fy * vNow * dt; camZ += fz * vNow * dt;
      } else {
        vEase += (0 - vEase) * Math.min(1, dt * 2);
        vNow = Math.abs(vEase) > 0.001 ? vEase : 0;
      }
    }
    // v0.4: attitude rates feed the chase-cam pose (bank on yaw, lift on pitch)
    if (dt > 0) { yawVel = (yaw - prevYaw) / dt; pitchVel = (pitch - prevPitch) / dt; }
    prevYaw = yaw; prevPitch = pitch;
  }

  var lastStatusStr = '';
  function updateHUD() {
    speedRead.textContent = fmtSpeed(vNow);
    if (mode === 'travel' && targetIdx >= 0) {
      var d = destByI[targetIdx];
      var dist = Math.hypot(gx[targetIdx] - camX, gy[targetIdx] - camY, gz[targetIdx] - camZ);
      var stopR = stopRadius();
      var remain = Math.max(0, dist - stopR);
      var cruise = warpToSpeed(warpLevel);
      var eta;
      if (cruise <= 0.01) eta = Infinity;   // paused: no countdown until speed raised
      else {
        var a2 = Math.max(4, Math.max(cruise, 0.9) * 0.35);
        var vRef = Math.max(vNow, Math.min(cruise, Math.sqrt(2 * a2 * remain)));
        // accel/cruise/brake profile -> monotonic decreasing estimate
        eta = remain <= vRef * vRef / (2 * a2) ? 2 * remain / Math.max(vRef, 0.01)
          : vRef / a2 + (remain - vRef * vRef / (2 * a2)) / cruise;
      }
      var paused = Math.abs(vNow) < 0.05 && warpLevel <= 0 && manualWarp === 0;
      var str = '航行中 → ' + d.title + ' · 剩余 ' + fmtLy(remain) + ' · 预计 ' +
        (eta < Infinity ? (eta < 0.2 ? '即将抵达' : eta.toFixed(eta < 10 ? 1 : 0) + ' 秒') : '—') +
        (paused ? ' ·（已暂停，调高速度档继续）' : '');
      statusEl.style.display = 'block';
      if (str !== lastStatusStr) { statusEl.textContent = str; lastStatusStr = str; }
    } else { statusEl.style.display = 'none'; lastStatusStr = ''; }
  }

  // ================= main loop =================
  var sleeping = false, stillFrames = 0, lastT = 0;
  function wake() { sleeping = false; stillFrames = 0; }

  function loop(t) {
    var dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0.016;
    lastT = t;
    if (keysOn['ArrowLeft'] || keysOn['ArrowRight'] || keysOn['ArrowUp'] || keysOn['ArrowDown']) wake();   // helm held: never sleep
    if (!sleeping) {
      updateNav(dt);
      renderStars();
      renderSpeedLines(dt);
      if (params.rabbitOn) {
        renderFlame();
        renderRabbit();
        var jitA = Math.min(2.4, Math.abs(vNow) / 300);
        var jx2 = (Math.random() - 0.5) * jitA, jy2 = (Math.random() - 0.5) * jitA * 0.7;
        // v0.4 chase-cam pose: bank into turns (yaw rate), lift on pitch, subtle zoom with speed
        var k4 = Math.min(1, dt * 4.5);
        shipBank += (Math.max(-0.15, Math.min(0.15, yawVel * 0.5)) - shipBank) * k4;
        shipPY += (Math.max(-14, Math.min(14, -pitchVel * 26)) - shipPY) * k4;
        shipSc += ((1 + Math.min(0.055, Math.abs(vNow) * 4e-5)) - shipSc) * Math.min(1, dt * 2.2);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.translate(offX + IMG_W * scale / 2 + jx2, offY + IMG_H * scale / 2 + jy2);
        ctx.rotate(shipBank); ctx.scale(shipSc, shipSc);
        ctx.drawImage(off, -IMG_W * scale / 2, -IMG_H * scale / 2 + shipPY, IMG_W * scale, IMG_H * scale);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
      updateHUD();
      updateAudio();
      if (Math.abs(vNow) < 0.001 && maxV2 < 1e-4 && !dragging) stillFrames++;
      else stillFrames = 0;
      if (stillFrames > 30) sleeping = true;
    }
    requestAnimationFrame(loop);
  }
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
